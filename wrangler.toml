name = "telegram-bot"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Giữ lại các biến bạn đã đặt trong dashboard (XSMB_URL, TAVILY_CAP, GEMINI_MODEL...) khi deploy từ GitHub.
# Secrets (TELEGRAM_BOT_TOKEN, GEMINI_API_KEY, TAVILY_API_KEY, GITHUB_WEBHOOK_SECRET...) luôn được giữ nguyên.
keep_vars = true

# Nhắc nhở mỗi 5 phút (đủ cho mốc 10'/30', và tiết kiệm hạn mức KV miễn phí)
[triggers]
crons = ["*/5 * * * *"]

# Dán ID thật của KV namespace USERS_KV: Cloudflare -> Storage & Databases -> KV -> USERS_KV -> copy ID
[[kv_namespaces]]
binding = "USERS_KV"
id = "DAN_ID_KV_THAT_VAO_DAY"

[observability]
enabled = true

[vars]
PERSONALITY_MODE = "dynamic"
GROUP_MODE = "mention_only"
